services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    tty: true
    networks:
      - app-network

  node:
    image: node:20
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    tty: true
    networks:
      - app-network

  mysql:
    image: mysql:8.1
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: future_app
      MYSQL_USER: future_user
      MYSQL_PASSWORD: future_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
